<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow: Personal Planner</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7c6cf0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5fa;--card:#fff;--tx:#1f1d2b;--mut:#6f6c80;--ln:#e6e3f0;--acc:#7c6cf0;--acc2:#efecff;--ok:#2f9e6e;--warn:#d9822b;--bad:#d64550;--sh:0 1px 3px rgba(40,30,90,.08),0 6px 18px rgba(40,30,90,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--card:#1e1c28;--tx:#ecebf4;--mut:#9b98ad;--ln:#2d2a3b;--acc:#9a8cff;--acc2:#2a2745;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141c;--card:#1e1c28;--tx:#ecebf4;--mut:#9b98ad;--ln:#2d2a3b;--acc:#9a8cff;--acc2:#2a2745;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ghost{border:0;background:none;color:var(--mut);padding:4px 7px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 10px}
.side{width:220px;padding:20px 12px;position:sticky;top:0;height:100vh;flex:none;border-right:1px solid var(--ln);background:var(--card)}
.logo{font-weight:700;font-size:18px;padding:0 10px 16px;color:var(--acc)}
.side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--mut);text-decoration:none;margin-bottom:2px}
.side a.on{background:var(--acc2);color:var(--acc);font-weight:600}
.short{display:none}
main{flex:1;min-width:0;padding:26px 28px 100px;max-width:1150px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mut{color:var(--mut);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.num{font-size:28px;font-weight:700}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);margin-bottom:8px;border-left:4px solid var(--ln)}
.task.p-High{border-left-color:var(--bad)}.task.p-Medium{border-left-color:var(--warn)}.task.p-Low{border-left-color:var(--ok)}
.task.Done .tt{text-decoration:line-through;color:var(--mut)}
.tt{font-weight:600;cursor:pointer;word-break:break-word}
.chk{width:22px;height:22px;border-radius:50%;padding:0;flex:none;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:4px;cursor:default}
.chip.s{cursor:pointer}.chip.od{background:#fde8ea;color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0}.seg .on{background:var(--acc);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--card);border-radius:14px;padding:10px;min-height:150px;box-shadow:var(--sh);border:2px solid transparent}
.day.today{border-color:var(--acc)}.day.over,.col.over{outline:2px dashed var(--acc)}
.day .task{padding:6px 8px;font-size:13px;margin-bottom:6px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--acc2);border-radius:14px;padding:10px;min-height:160px}
.tm{text-align:center}.big{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
.ch{width:100%;height:auto}.ch text{fill:var(--mut);font-size:10px}
.bar{height:8px;background:var(--acc2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
#modal{position:fixed;inset:0;background:rgba(20,15,40,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:30}
#modal .card{width:100%;max-width:560px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rrow{display:grid;grid-template-columns:1fr 1fr 100px auto;gap:6px;margin-bottom:6px;padding:8px;border:1px solid var(--ln);border-radius:10px}
.rrow .rn{grid-column:1/4}
#toasts{position:fixed;top:14px;right:14px;z-index:50;display:grid;gap:8px;max-width:320px}
#toasts div{background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--sh)}
#mini{position:fixed;right:16px;bottom:16px;background:var(--acc);color:#fff;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;display:none;z-index:20}
@media(max-width:820px){
body{display:block}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln);z-index:25}
.logo,.full{display:none}.short{display:inline;font-size:11px}
.side a{flex-direction:column;gap:0;padding:6px 10px;margin:0;min-width:62px;text-align:center}
main{padding:18px 14px 110px}
.days{grid-template-columns:1fr}.cols{grid-template-columns:1fr}
#mini{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.rrow{grid-template-columns:1fr 1fr}.rrow .rn{grid-column:1/3}
}
.side:empty{display:none}.auth{max-width:420px;margin:12vh auto}
.pills{display:flex;gap:4px;flex-wrap:wrap}select.pill{width:auto;border:0;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:600;cursor:pointer}.f2 select.pill{width:100%;border-radius:10px;padding:8px 10px;font-size:15px}.c-red{background:#fde2e4;color:#b4232f}.c-yel{background:#fff1c9;color:#8a5a00}.c-grn{background:#d9f3e4;color:#17704a}select.pill option{background:var(--card);color:var(--tx)}
</style></head>
<body>
<nav class="side" id="nav"></nav>
<main id="main"></main>
<div id="mini"><span id="mclk"></span></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
const KEY="flow.v1";
const D={tasks:[],sessions:[],log:[],set:{name:"",tz:"Asia/Dhaka",ws:1,notif:true,sound:true,work:25,short:5,long:15,every:4,auto:false,theme:"light",rem:10}};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return{...D,...j,set:{...D.set,...j.set}}}catch(e){}return structuredClone(D)}
let S=load(),storeOk=true;
function save(r=true){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOk=false}if(window.SB&&SB.user)sync();if(r)render()}
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const tz=()=>S.set.tz||"Asia/Dhaka";
const today=()=>new Date().toLocaleDateString("sv-SE",{timeZone:tz()});
const nowHM=()=>new Date().toLocaleTimeString("en-GB",{timeZone:tz(),hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dow=d=>new Date(d+"T00:00:00Z").getUTCDay();
const wkStart=d=>addDays(d,-((dow(d)-S.set.ws+7)%7));
const fmt=(d,o)=>new Date(d+"T00:00:00Z").toLocaleDateString("en-US",{timeZone:"UTC",...o});
const mOf=(d,t)=>Date.parse(d+"T"+(t||"00:00")+":00Z")/60000;
const nowMin=()=>mOf(today(),nowHM());
const hm=m=>m>=60?Math.floor(m/60)+"h "+(Math.round(m%60)?Math.round(m%60)+"m":""):Math.round(m)+"m";
const safeUrl=u=>{u=(u||"").trim();if(!u)return"";try{const x=new URL(/^https?:/i.test(u)?u:"https://"+u);return/^https?:$/.test(x.protocol)?x.href:""}catch(e){return""}};
const tracked=id=>S.sessions.filter(s=>s.taskId===id).reduce((a,s)=>a+s.mins,0);
const getT=id=>S.tasks.find(t=>t.id===id);
const cmpT=(a,b)=>(a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99"));
const overdue=t=>t.status!=="Done"&&(t.date<today()||(t.date===today()&&t.time&&mOf(t.date,t.time)+(t.dur||0)<nowMin()));
const ST=["Pending","Ongoing","Done"];
const SL={Pending:"Not Started",Ongoing:"Ongoing",Done:"Done"},COL={High:"red",Medium:"yel",Low:"grn",Pending:"red",Ongoing:"yel",Done:"grn"};
const pill=(k,id,v)=>`<select class="pill c-${COL[v]}" data-c="${k}" data-id="${id}" aria-label="${k==="tp"?"Priority":"Status"}">${(k==="tp"?["High","Medium","Low"]:ST).map(x=>`<option value="${x}" ${x===v?"selected":""}>${k==="tp"?x:SL[x]}</option>`).join("")}</select>`;
const cats=()=>[...new Set(S.tasks.map(t=>t.cat).filter(Boolean))].sort();
let R={wk:null,wv:"week",day:null,tv:"list",F:{date:"all",cat:"",pri:"",st:"",q:""},ar:"week",af:"",at:"",rq:"",rt:"",rc:""};
let EDIT=null;
const route=()=>location.hash.slice(1)||"dash";

/* notifications and sound */
let AC;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.15)})}catch(e){}}
function toast(m){const d=document.createElement("div");d.textContent=m;$("#toasts").appendChild(d);setTimeout(()=>d.remove(),7000)}
function ping(title,body){S.log.unshift({ts:Date.now(),title,body});S.log=S.log.slice(0,40);save(false);toast(title+(body?": "+body:""));if(S.set.sound)beep();if(S.set.notif&&"Notification"in window&&Notification.permission==="granted"){try{navigator.serviceWorker&&navigator.serviceWorker.controller?navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png"})):new Notification(title,{body})}catch(e){}}}
function askNotif(){if(!("Notification"in window)){toast("This browser does not support notifications.");return}Notification.requestPermission().then(()=>render()).catch(()=>toast("Permission request was blocked here."))}
const permTxt=()=>!("Notification"in window)?"Not supported in this browser. You will still get in-app alerts.":Notification.permission==="granted"?"Browser notifications are on.":Notification.permission==="denied"?"Blocked. Allow notifications for this site in your browser settings.":"Not allowed yet.";
function checkReminders(){if(!S.set.notif)return;const n=nowMin();let ch=0;S.tasks.forEach(t=>{if(t.status==="Done"||t.notified||!t.time||t.remind===""||t.remind==null)return;const st=mOf(t.date,t.time),r=+t.remind;if(n>=st-r&&n<=st+30){t.notified=true;ch=1;ping(r?"Starting in "+r+" min":"Time to start",t.title+" at "+t.time)}});if(ch)save()}

/* pomodoro */
const T={mode:"work",run:false,end:0,left:S.set.work*60000,task:"",cycle:0};
const dur=m=>S.set[m]*60000;
const clock=()=>{const ms=T.run?Math.max(0,T.end-Date.now()):T.left,s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tStart(){if(T.run)return;T.end=Date.now()+T.left;T.run=true;render()}
function tPause(){if(!T.run)return;T.left=Math.max(0,T.end-Date.now());T.run=false;render()}
function tMode(m){T.mode=m;T.run=false;T.left=dur(m);render()}
function addSession(mins,kind){if(mins<1)return;S.sessions.push({id:uid(),taskId:T.task||"",mins,date:today(),ts:Date.now(),kind});save(false)}
function tFinish(){const w=T.mode==="work";if(w){addSession(S.set.work,"pomodoro");T.cycle++}
const nx=w?(T.cycle%S.set.every===0?"long":"short"):"work";
ping(w?"Focus session complete":"Break is over",w?"Nice work. Time for a "+(nx==="long"?"long":"short")+" break.":"Ready for the next session?");
T.mode=nx;T.left=dur(nx);T.run=false;if(S.set.auto){T.end=Date.now()+T.left;T.run=true}render()}
function tStop(){if(T.mode==="work"){const el=dur("work")-(T.run?T.end-Date.now():T.left);addSession(Math.round(el/60000),"pomodoro");}T.run=false;T.left=dur(T.mode);render()}
function timerCard(sel){const m=T.mode,open=S.tasks.filter(t=>t.status!=="Done").sort(cmpT);
return`<div class="card tm"><div class="seg">${[["work","Focus"],["short","Short break"],["long","Long break"]].map(x=>`<button class="${m===x[0]?"on":""}" data-a="mode" data-id="${x[0]}">${x[1]}</button>`).join("")}</div>
<div class="tclock big">${clock()}</div>
${sel?`<select data-c="tsel" aria-label="Task to focus on"><option value="">No task selected</option>${open.map(t=>`<option value="${t.id}" ${T.task===t.id?"selected":""}>${esc(t.title)}</option>`).join("")}</select>`:`<div class="mut">${T.task&&getT(T.task)?esc(getT(T.task).title):"No task selected"}</div>`}
<div class="row" style="justify-content:center;margin-top:12px">${T.run?`<button class="pri" data-a="pause">Pause</button>`:`<button class="pri" data-a="start">${T.left<dur(m)?"Resume":"Start"}</button>`}<button data-a="reset">Reset</button>${m==="work"?`<button data-a="stop" title="Save the time so far">Stop and save</button>`:""}</div>
<div class="mut" style="margin-top:10px">Sessions today: ${S.sessions.filter(s=>s.date===today()&&s.kind==="pomodoro").length}</div></div>`}

/* task ui */
function card(t,small){const tr=tracked(t.id),od=overdue(t);
return`<div class="task p-${t.pri} ${t.status}" draggable="true" data-drag="${t.id}"><button class="chk ${t.status==="Done"?"on":""}" data-a="toggle" data-id="${t.id}" aria-label="Mark done">${t.status==="Done"?"✓":""}</button>
<div class="sp" style="min-width:0"><div class="tt" data-a="edit" data-id="${t.id}">${esc(t.title)}</div>
<div class="mut">${t.time?esc(t.time)+(t.dur?" · "+hm(t.dur):""):"Anytime"}${small?"":" · "+fmt(t.date,{month:"short",day:"numeric"})}${tr?" · tracked "+hm(tr):""}${t.res&&t.res.length?" · "+t.res.length+" link"+(t.res.length>1?"s":""):""}</div>
<div class="pills" style="margin-top:4px">${pill("ts",t.id,t.status)}${pill("tp",t.id,t.pri)}${od?`<span class="chip od">Overdue</span>`:""}${t.cat?`<span class="chip">${esc(t.cat)}</span>`:""}${t.deadline?`<span class="chip">Due ${esc(t.deadline)}</span>`:""}</div></div>
${small?"":`<div class="row" style="gap:0"><button class="ghost" data-a="dup" data-id="${t.id}" aria-label="Duplicate">⧉</button><button class="ghost" data-a="del" data-id="${t.id}" aria-label="Delete">✕</button></div>`}</div>`}
function openTask(id,date){EDIT=id?getT(id):null;const t=EDIT||{date:date||today(),time:"",dur:30,pri:"Medium",status:"Pending",cat:"",deadline:"",remind:S.set.notif?String(S.set.rem):"",res:[],desc:"",title:""};
const o=(arr,v)=>arr.map(x=>`<option ${String(x[0]??x)===String(v)?"selected":""} value="${x[0]??x}">${x[1]??x}</option>`).join("");
$("#modal").innerHTML=`<div class="card"><h2>${EDIT?"Edit task":"New task"}</h2>
<div style="margin-bottom:10px"><label>What do you want to do?</label><input id="f_t" value="${esc(t.title)}" placeholder="e.g. Learn Advanced Excel"></div>
<div class="f2"><div><label>Date</label><input id="f_dt" type="date" value="${t.date}"></div><div><label>Starts at</label><input id="f_tm" type="time" value="${t.time||""}"></div>
<div><label>Estimated minutes</label><input id="f_du" type="number" min="0" step="5" value="${t.dur||""}"></div><div><label>Priority</label><select id="f_p" class="pill c-${COL[t.pri]}" onchange="this.className='pill c-'+({High:'red',Medium:'yel',Low:'grn',Pending:'red',Ongoing:'yel',Done:'grn'})[this.value]">${o(["High","Medium","Low"],t.pri)}</select></div>
<div><label>Status</label><select id="f_s" class="pill c-${COL[t.status]}" onchange="this.className='pill c-'+({High:'red',Medium:'yel',Low:'grn',Pending:'red',Ongoing:'yel',Done:'grn'})[this.value]">${o([["Pending","Not Started"],["Ongoing","Ongoing"],["Done","Done"]],t.status)}</select></div><div><label>Category or tag</label><input id="f_c" list="cl" value="${esc(t.cat)}" placeholder="Study, Work…"><datalist id="cl">${["Work","Study","Personal","Health",...cats()].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
<div><label>Deadline (optional)</label><input id="f_dl" type="date" value="${t.deadline||""}"></div><div><label>Remind me</label><select id="f_r">${o([["","No reminder"],["0","At start time"],["5","5 min before"],["10","10 min before"],["15","15 min before"]],t.remind??"")}</select></div></div>
<div style="margin-bottom:10px"><label>Notes</label><textarea id="f_d">${esc(t.desc)}</textarea></div>
<label>Resources</label><div id="rl">${(t.res||[]).map(resRow).join("")}</div><button data-a="addres">+ Add resource</button>
<div class="row" style="margin-top:16px"><button class="pri" data-a="save">Save task</button><button data-a="close">Cancel</button><span class="sp"></span>${EDIT?`<button data-a="del" data-id="${t.id}" data-close="1">Delete</button>`:""}</div></div>`;
$("#modal").style.display="flex";setTimeout(()=>$("#f_t").focus(),30)}
function resRow(r){r=r||{};return`<div class="rrow" data-id="${r.id||""}"><input class="rt" placeholder="Title" value="${esc(r.title)}"><input class="ru" placeholder="https://…" value="${esc(r.url)}"><select class="ry">${["Video","Article","Book","Course","Document","Other"].map(x=>`<option ${r.type===x?"selected":""}>${x}</option>`).join("")}</select><button class="ghost" data-a="rmres" aria-label="Remove">✕</button><input class="rn" placeholder="Short note" value="${esc(r.note)}"></div>`}
const closeM=()=>{$("#modal").style.display="none";EDIT=null};

/* actions */
const ACT={
toggle(id){const t=getT(id);t.status=t.status==="Done"?"Pending":"Done";save()},
cycle(id){const t=getT(id);t.status=ST[(ST.indexOf(t.status)+1)%3];save()},
edit(id){openTask(id)},
add(id,b){openTask(null,b.dataset.date)},
dup(id){const t=getT(id),c=structuredClone(t);c.id=uid();c.title+=" (copy)";c.status="Pending";c.notified=false;(c.res||[]).forEach(r=>r.id=uid());S.tasks.push(c);save()},
del(id,b){if(!b.dataset.sure){b.dataset.sure=1;const o=b.textContent;b.textContent="Sure?";setTimeout(()=>{b.dataset.sure="";b.textContent=o},3000);return}S.tasks=S.tasks.filter(t=>t.id!==id);S.sessions.forEach(s=>{if(s.taskId===id)s.taskId=""});if(T.task===id)T.task="";closeM();save()},
close:closeM,
addres(){$("#rl").insertAdjacentHTML("beforeend",resRow())},
rmres(id,b){b.closest(".rrow").remove()},
save(){const g=i=>$("#"+i).value,title=g("f_t").trim();if(!title){$("#f_t").focus();return}
const t=EDIT||{id:uid(),notified:false},k=t.date+t.time+t.remind;
Object.assign(t,{title,desc:g("f_d"),date:g("f_dt")||today(),time:g("f_tm"),dur:+g("f_du")||0,pri:g("f_p"),status:g("f_s"),cat:g("f_c").trim(),deadline:g("f_dl"),remind:g("f_r")});
if(k!==t.date+t.time+t.remind)t.notified=false;
t.res=[...document.querySelectorAll(".rrow")].map(r=>({id:r.dataset.id||uid(),title:$(".rt",r).value.trim(),url:safeUrl($(".ru",r).value),type:$(".ry",r).value,note:$(".rn",r).value.trim()})).filter(r=>r.title||r.url);
if(!EDIT)S.tasks.push(t);closeM();save();if(t.remind!==""&&"Notification"in window&&Notification.permission==="default")toast("Tip: allow browser notifications in Settings so reminders reach you.")},
mode(id){tMode(id)},start:tStart,pause:tPause,reset(){T.run=false;T.left=dur(T.mode);render()},stop:tStop,

function tickUI(){const c=clock();document.querySelectorAll(".tclock").forEach(e=>e.textContent=c);$("#mclk").textContent=({work:"Focus ",short:"Break ",long:"Long break "}[T.mode])+c;document.title=T.run?c+" · Flow":"Flow: Personal Planner"}
setInterval(()=>{if(T.run&&T.end-Date.now()<=0)tFinish();else tickUI()},500);
setInterval(checkReminders,15000);
window.addEventListener("hashchange",render);
window.addEventListener("beforeunload",e=>{if(T.run){e.preventDefault();e.returnValue=""}});
document.addEventListener("change",e=>{if(e.target.id!=="imp"||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!Array.isArray(j.tasks))throw 0;S={...D,...j,set:{...D.set,...j.set}};save();toast("Backup restored.")}catch(x){toast("That file is not a valid backup.")}};fr.readAsText(e.target.files[0])});

/* ---- Supabase sync ---- */
const SBC=window.FLOW_CONFIG||{};let sb=null,last={},lastSet="",busy=false,again=false;
window.SB={user:null,ready:false};
const nz=v=>v===""||v==null?null:v;
const MAP={
tasks:{tbl:"tasks",list:()=>S.tasks,row:t=>({id:t.id,title:t.title,descr:t.desc||"",sched_date:t.date,sched_time:nz(t.time),dur:t.dur||0,pri:t.pri,status:t.status,cat:t.cat||"",deadline:nz(t.deadline),remind:nz(t.remind),notified:!!t.notified})},
resources:{tbl:"task_resources",list:()=>S.tasks.flatMap(t=>(t.res||[]).map(r=>({...r,tid:t.id}))),row:r=>({id:r.id,task_id:r.tid,title:r.title||"",url:r.url||"",type:r.type,note:r.note||""})},
sessions:{tbl:"pomodoro_sessions",list:()=>S.sessions,row:s=>({id:s.id,task_id:nz(s.taskId),mins:s.mins,sess_date:s.date,ts:s.ts,kind:s.kind})},
log:{tbl:"notifications",list:()=>S.log.map(l=>({...l,id:String(l.ts)})),row:l=>({id:l.id,ts:l.ts,title:l.title,body:l.body||""})}};
function snap(){for(const k in MAP){const m=MAP[k];last[k]=new Map(m.list().map(x=>[x.id,JSON.stringify(m.row(x))]))}lastSet=JSON.stringify(S.set)}
async function sync(){if(busy){again=true;return false}busy=true;let ok=true;
try{const ups=[],dels=[],nl={};
for(const k in MAP){const m=MAP[k],cur=new Map(m.list().map(x=>[x.id,JSON.stringify(m.row(x))])),prev=last[k]||new Map();nl[k]=cur;
const u=[];cur.forEach((j,id)=>{if(prev.get(id)!==j)u.push(JSON.parse(j))});if(u.length)ups.push([m.tbl,u]);
const d=[...prev.keys()].filter(id=>!cur.has(id));if(d.length)dels.unshift([m.tbl,d])}
const sj=JSON.stringify(S.set);if(sj!==lastSet)ups.push(["user_settings",[{user_id:SB.user.id,data:S.set}]]);
for(const[t,r]of ups){const{error}=await sb.from(t).upsert(r);if(error)throw error}
for(const[t,d]of dels){const{error}=await sb.from(t).delete().in("id",d);if(error)throw error}
Object.assign(last,nl);lastSet=sj;SB.warned=0}
catch(e){ok=false;if(!SB.warned){SB.warned=1;toast("Could not sync. Your changes are kept on this device and will sync when you are back online.")}}
busy=false;if(again){again=false;sync()}return ok}
async function pull(){const q=t=>sb.from(t).select("*").limit(5000);
const[a,b,c,d,e]=await Promise.all([q("tasks"),q("task_resources"),q("pomodoro_sessions"),q("notifications"),sb.from("user_settings").select("data").maybeSingle()]);
const er=[a,b,c,d,e].find(x=>x.error);if(er)throw er.error;
if(!a.data.length&&!c.data.length&&S.tasks.length)return false;
S.tasks=a.data.map(r=>({id:r.id,title:r.title,desc:r.descr,date:r.sched_date,time:r.sched_time||"",dur:r.dur,pri:r.pri,status:r.status,cat:r.cat,deadline:r.deadline||"",remind:r.remind??"",notified:r.notified,res:b.data.filter(x=>x.task_id===r.id).map(x=>({id:x.id,title:x.title,url:x.url,type:x.type,note:x.note}))}));
S.sessions=c.data.map(r=>({id:r.id,taskId:r.task_id||"",mins:r.mins,date:r.sess_date,ts:+r.ts,kind:r.kind}));
S.log=d.data.map(r=>({ts:+r.ts,title:r.title,body:r.body})).sort((x,y)=>y.ts-x.ts).slice(0,40);
S.set={...D.set,...(e.data&&e.data.data||{})};snap();return true}
async function setUser(u){SB.user=u||null;SB.ready=true;if(u){try{await pull();await sync()}catch(e){toast("Could not load your data: "+e.message)}save(false)}render();checkReminders()}
async function refresh(){if(!SB.user||busy)return;if(await sync()){try{if(await pull()){save(false);render()}}catch(e){}}}
function authView(){let h;if(SB.setup)h=`<h2>One setup step left</h2><p class="mut">Open <b>config.js</b> and paste your Supabase project URL and anon key. The README explains where to find them.</p>`;
else if(!SB.ready)h=`<p class="mut">Loading…</p>`;
else if(SB.sent)h=`<h2>Check your email</h2><p>We sent a sign in link to <b>${esc(SB.sent)}</b>. Open it on this device.</p>`;
else h=`<h2>Sign in to Flow</h2><p class="mut">Enter your email. We will send you a link, no password needed.</p><input id="em" type="email" placeholder="you@example.com" autocomplete="email"><div style="margin-top:10px"><button class="pri" data-a="login">Email me a link</button></div>${SB.msg?`<p class="mut">${esc(SB.msg)}</p>`:""}`;
return`<div class="card auth"><div class="logo" style="padding-left:0">◔ Flow</div>${h}</div>`}
ACT.login=async(id,b)=>{const em=$("#em").value.trim();if(!em)return;b.disabled=true;const{error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});SB.sent=error?"":em;SB.msg=error?error.message:"";render()};
ACT.signout=async()=>{await sb.auth.signOut()};
ACT.export=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="flow-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function boot(){if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!SBC.url||/YOUR/.test(SBC.url)){SB.setup=1;SB.ready=true;render();return}
if(!window.supabase){SB.ready=true;SB.msg="Could not load the sign in library. Check your connection and reload.";render();return}
sb=supabase.createClient(SBC.url,SBC.anonKey);
sb.auth.onAuthStateChange((ev,ss)=>{if(ev==="SIGNED_OUT"){S=structuredClone(D);try{localStorage.removeItem(KEY)}catch(e){}last={};setUser(null)}else if(ev==="SIGNED_IN"&&(!SB.user||SB.user.id!==ss.user.id))setUser(ss.user)});
const{data}=await sb.auth.getSession();if(data.session)await setUser(data.session.user);else{SB.ready=true;render()}
addEventListener("online",sync);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()})}
boot();
</script></body></html>
